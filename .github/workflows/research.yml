
name: BountyPilot Security Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public vulnerability intelligence
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
          request = urllib.request.Request(
              url, headers={"User-Agent": "BountyPilot/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              catalog = json.loads(response.read())

          watchlist = [
              "microsoft", "google", "apple", "openai",
              "shopify", "binance", "okta", "mozilla",
              "sophos", "t-mobile"
          ]

          matches = []
          for item in catalog.get("vulnerabilities", []):
              vendor = item.get("vendorProject", "")
              product = item.get("product", "")
              combined = (vendor + " " + product).lower()

              if any(name in combined for name in watchlist):
                  matches.append(item)

          lines = [
              "# BountyPilot Research Leads",
              "",
              "Source: CISA Known Exploited Vulnerabilities catalog",
              "Updated: " + datetime.now(timezone.utc).isoformat(),
              "",
              "**Important:** These are intelligence leads, not confirmed "
              "bounty findings. Check program scope, versions and policy "
              "before any authorized research.",
              "",
              f"Matching entries: {len(matches)}",
              ""
          ]

          for item in matches:
              lines.extend([
                  "## " + item.get("cveID", "Unknown CVE"),
                  "- Vendor: " + item.get("vendorProject", "Unknown"),
                  "- Product: " + item.get("product", "Unknown"),
                  "- Date added: " + item.get("dateAdded", "Unknown"),
                  "- Due date: " + item.get("dueDate", "Unknown"),
                  "- Description: " + item.get("shortDescription", "No description"),
                  ""
              ])

          Path("research").mkdir(exist_ok=True)
          Path("research/latest-leads.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )
          print(f"Collected {len(matches)} matching intelligence leads.")
          PY

      - name: Save research results
        run: |
          git config user.name "BountyPilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/latest-leads.md
          if ! git diff --cached --quiet; then
            git commit -m "Update vulnerability intelligence"
            git push
          else
            echo "No changes to save."
          fi
          
